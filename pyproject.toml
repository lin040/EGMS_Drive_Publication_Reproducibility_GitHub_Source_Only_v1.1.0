[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "egms-drive-publication-reproducibility"
version = "2.0.0"
description = "Auditable Study 1-R training and raw-output reproduction for EGMS-Drive, with publication figures, controlled Studies 2-3, and power analysis"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
authors = [
  {name = "Shih-Lin Lin", email = "lin040@cc.ncue.edu.tw"},
]
keywords = [
  "autonomous driving",
  "controlled synthetic evaluation",
  "multisensor fusion",
  "scene graph",
  "power analysis",
  "reproducible research",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "scipy>=1.12,<2",
  "scikit-learn>=1.4,<2",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1",
  "PyYAML>=6.0,<7",
  "Pillow>=10,<13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "nbformat>=5.10,<6",
  "nbclient>=0.10,<1",
  "ipykernel>=7,<8",
]

[project.scripts]
egms-publication = "egms_publication.runner:main"
egms-power = "egms_power.cli:main"
egms-studies23 = "egms_studies23.runner:main"
egms-study1r = "egms_study1r.runner:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
